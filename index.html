<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Pixora - Pixel Art Editor</title>

        <!-- Google Site Verification -->
        <meta name="google-site-verification" content="hgObvy2FjjhyxgNLQrIijV9ZKD3oqYdGN9qsHexJn28" />

        <!-- SEO -->
        <meta name="description" content="Pixora is a free, browser-based pixel art editor with layers, multiple tools, color palettes, and export options. Create pixel art directly in your browser." />
        <meta name="keywords" content="pixel art, editor, pixel editor, art tool, browser, free, online" />
        <link rel="canonical" href="https://blqnk3d.github.io/Pixora/" />

        <!-- Open Graph -->
        <meta property="og:title" content="Pixora - Pixel Art Editor" />
        <meta property="og:description" content="A free, browser-based pixel art editor with layers, multiple tools, and export options." />
        <meta property="og:image" content="https://blqnk3d.github.io/Pixora/og-image.webp" />
        <meta property="og:url" content="https://blqnk3d.github.io/Pixora/" />
        <meta property="og:type" content="website" />
        <meta property="og:site_name" content="Pixora" />

        <!-- Twitter Card -->
        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:title" content="Pixora - Pixel Art Editor" />
        <meta name="twitter:description" content="A free, browser-based pixel art editor with layers, multiple tools, and export options." />

        <!-- Structured Data -->
        <script type="application/ld+json">
        {
          "@context": "https://schema.org",
          "@type": "WebApplication",
          "name": "Pixora",
          "url": "https://blqnk3d.github.io/Pixora/",
          "description": "A free, browser-based pixel art editor with layers, multiple tools, color palettes, and export options.",
          "applicationCategory": "Multimedia",
          "operatingSystem": "Any",
          "browserRequirements": "Requires JavaScript"
        }
        </script>

        <!-- Preconnect -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

        <link rel="stylesheet" href="css/themes.css" />
        <link rel="stylesheet" href="css/style.css" />
        <link rel="icon" type="image/svg+xml" href="icon.svg" />
        <link rel="manifest" href="manifest.json" />
        <link
            id="retro-font-link"
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
            style="display: none"
        />
    </head>
    <body>
        <div id="app">
            <div id="menu-bar"></div>
            <div id="tab-bar"></div>
            <div id="main-container">
                <div id="left-toolbar"></div>
                <div id="canvas-container">
                    <div class="canvas-workspace">
                        <canvas id="pixel-canvas"></canvas>
                        <canvas id="overlay-canvas"></canvas>
                    </div>
                </div>
                <div id="right-panels">
                    <div id="tool-settings"></div>
                    <div id="color-panel"></div>
                    <div id="layers-panel"></div>
                </div>
            </div>
            <div id="status-bar"></div>
        </div>
        <script type="module" src="js/app.js"></script>
        <script>
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('/Pixora/sw.js');
            }
        </script>
    </body>
</html>
