<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="6" fill="#1a1a2e"/>

  <!-- 3x3 pixel grid - diagonal grayscale -->
  <rect x="8" y="8" width="4" height="4" rx="0.5" fill="#aaa"/>
  <rect x="14" y="8" width="4" height="4" rx="0.5" fill="#777"/>
  <rect x="20" y="8" width="4" height="4" rx="0.5" fill="#555"/>
  <rect x="8" y="14" width="4" height="4" rx="0.5" fill="#777"/>
  <rect x="20" y="14" width="4" height="4" rx="0.5" fill="#444"/>
  <rect x="8" y="20" width="4" height="4" rx="0.5" fill="#555"/>
  <rect x="14" y="20" width="4" height="4" rx="0.5" fill="#444"/>
  <rect x="20" y="20" width="4" height="4" rx="0.5" fill="#222"/>

  <!-- Center pixel - highlighted active edit -->
  <rect x="14" y="14" width="4" height="4" rx="0.5" fill="#f5f5f5"/>
  <rect x="15" y="15" width="2" height="2" rx="0.3" fill="#fff" opacity="0.6"/>

  <!-- Dashed selection border (pixel editor UI) -->
  <rect x="13" y="13" width="6" height="6" rx="0.5" fill="none" stroke="#fff" stroke-width="0.8"
        stroke-dasharray="2,1.5" opacity="0.7"/>

  <!-- Crosshair guides -->
  <line x1="16" y1="6" x2="16" y2="11" stroke="#888" stroke-width="0.5" opacity="0.4"/>
  <line x1="16" y1="19" x2="16" y2="24" stroke="#888" stroke-width="0.5" opacity="0.4"/>
  <line x1="6" y1="16" x2="11" y2="16" stroke="#888" stroke-width="0.5" opacity="0.4"/>
  <line x1="19" y1="16" x2="24" y2="16" stroke="#888" stroke-width="0.5" opacity="0.4"/>
</svg>
